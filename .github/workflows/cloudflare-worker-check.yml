name: Validate Cloudflare Python Worker (experimental)

on:
  push:
    branches:
      - cloudflare/python-worker-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        run: python -m pip install uv
      - name: Resolve Python Worker packages and dependencies
        run: python -m uv sync
      - name: Validate Cloudflare Worker bundling without publishing
        run: python -m uv run pywrangler deploy --dry-run

[project]
name = "student-performance-prediction-cloudflare"
version = "0.1.0"
description = "Experimental Cloudflare Workers adapter for the existing Flask application"
requires-python = ">=3.13"
dependencies = [
  "Flask>=3.0,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "psycopg>=3.2,<4",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]
